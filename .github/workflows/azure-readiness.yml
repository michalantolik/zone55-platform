name: Azure readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  TERRAFORM_VERSION: 1.13.5
  CONFIGURATION: Release
  SOLUTION_PATH: Zone55.slnx

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal
      - name: Validate Terraform
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Verify retired CMS is excluded
        shell: bash
        run: |
          ! grep -q "BlogPlatform.Cms" "${SOLUTION_PATH}"
          ! grep -RIn "BlogPlatform.Cms\|Umbraco.Cms" src/LearnKit src/Zone55 --include='*.csproj'
