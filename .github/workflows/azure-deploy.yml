name: Azure deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Azure readiness]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  TERRAFORM_VERSION: 1.13.5
  CONFIGURATION: Release
  SOLUTION_PATH: Zone55.slnx
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Read Terraform outputs
        working-directory: infra
        shell: bash
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER_NAME }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}"
          echo "RESOURCE_GROUP_NAME=$(terraform output -raw resource_group_name)" >> "$GITHUB_ENV"
          echo "API_APP_NAME=$(terraform output -raw api_app_service_name)" >> "$GITHUB_ENV"
          echo "STATIC_WEB_APP_NAME=$(terraform output -raw static_web_app_name)" >> "$GITHUB_ENV"
          echo "API_PUBLIC_URL=$(terraform output -raw api_app_service_url)/" >> "$GITHUB_ENV"
          echo "APP_PUBLIC_URL=$(terraform output -raw static_web_app_url)/" >> "$GITHUB_ENV"
      - name: Configure production API URL
        shell: bash
        run: |
          cat > src/Zone55/Zone55.App/wwwroot/appsettings.Production.json <<JSON
          { "Api": { "BaseUrl": "${API_PUBLIC_URL}" } }
          JSON
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build and test
        run: |
          dotnet restore ${{ env.SOLUTION_PATH }}
          dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-restore
          dotnet test ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-build
      - name: Publish API and clients
        run: |
          dotnet publish src/Zone55/Zone55.Api/Zone55.Api.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output artifacts/api
          dotnet publish src/Zone55/Zone55.App/Zone55.App.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output artifacts/app
          dotnet publish src/Zone55/Zone55.Management/Zone55.Management.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output artifacts/management
      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: artifacts/api
          clean: true
          restart: true
      - name: Get Static Web App token
        shell: bash
        run: |
          token=$(az staticwebapp secrets list --name "${STATIC_WEB_APP_NAME}" --resource-group "${RESOURCE_GROUP_NAME}" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Deploy Portal
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: artifacts/app/wwwroot
          api_location: ""
          output_location: ""
          skip_app_build: true
      - name: Smoke check active platform
        shell: bash
        run: |
          bash .github/workflows/scripts/check-url.sh "${API_PUBLIC_URL}health/live" "API live health"
          bash .github/workflows/scripts/check-url.sh "${API_PUBLIC_URL}health/ready" "API ready health"
          bash .github/workflows/scripts/check-url.sh "${API_PUBLIC_URL}api/learnkit/roadmaps/dotnet" "LearnKit roadmap"
          bash .github/workflows/scripts/check-url.sh "${APP_PUBLIC_URL}" "Portal"
