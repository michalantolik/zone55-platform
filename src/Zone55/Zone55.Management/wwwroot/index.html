<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zone55 Management</title>
    <base href="/" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <script src="js/client-crash-diagnostics.js"></script>
    <div id="app">
        <div class="boot-screen">Loading Zone55 Management…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/content-seed.js"></script>
    <script>window.zone55CrashDiagnostics?.mark('BlazorLoaderRequested', { application: 'MANAGEMENT' });</script>
    <script src="_framework/blazor.webassembly.js"
            onload="window.zone55CrashDiagnostics?.mark('BlazorLoaderScriptLoaded', { application: 'MANAGEMENT' })"
            onerror="window.zone55CrashDiagnostics?.record('BlazorLoaderScriptFailed', 'Failed to load _framework/blazor.webassembly.js', { application: 'MANAGEMENT' })"></script>
</body>
</html>
