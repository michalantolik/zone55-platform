# =============================================================================
# Zone55 local platform
#
# Default stack:
#   docker compose up --build
#
# Startup order:
#   sqlserver -> api (LearnKit database ready) -> app + management
# =============================================================================

name: blogplatform

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blogplatform-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-BlogPlatform_Dev#2024}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - blogplatform-net
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
        -Q "SELECT 1" -No
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: blogplatform-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Zone55Connection: >-
        Server=sqlserver,1433;
        Database=Zone55Db;
        User Id=sa;
        Password=${SQL_SA_PASSWORD:-BlogPlatform_Dev#2024};
        TrustServerCertificate=True;
        MultipleActiveResultSets=True;
      ClientLogging__Enabled: "true"
      ClientLogging__MaxMessageLength: "2000"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Cors__AllowedOrigins__1: "http://localhost:8081"
    ports:
      - "5000:8080"
    networks:
      - blogplatform-net
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        BLAZOR_API_BASE_URL: "http://localhost:5000/"
    container_name: blogplatform-app
    environment:
      NGINX_HOST: localhost
    ports:
      - "8080:80"
    networks:
      - blogplatform-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  management:
    build:
      context: .
      dockerfile: Dockerfile.management
      args:
        MANAGEMENT_API_BASE_URL: "http://localhost:5000/"
        MANAGEMENT_PORTAL_BASE_URL: "http://localhost:8080/"
    container_name: blogplatform-management
    environment:
      NGINX_HOST: localhost
    ports:
      - "8081:80"
    networks:
      - blogplatform-net
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped


networks:
  blogplatform-net:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local
